name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One build per branch; a newer push cancels the older run.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The Android NDK + Gradle caches need more disk than the default runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2* /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Dependencies & code generation
        run: |
          flutter pub get
          dart run tool/merge_arb.dart
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      # Optional release signing. Add these repository secrets (Settings → Secrets → Actions):
      # IRONMIND_KEYSTORE_BASE64 (base64 of the .jks), IRONMIND_KEYSTORE_PASSWORD,
      # IRONMIND_KEY_ALIAS, IRONMIND_KEY_PASSWORD. Without them the APK is signed with a debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.IRONMIND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ironmind.jks"
            echo "IRONMIND_KEYSTORE_PATH=$RUNNER_TEMP/ironmind.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets configured – building with the debug key."
          fi

      - name: Build release APK
        env:
          IRONMIND_KEYSTORE_PASSWORD: ${{ secrets.IRONMIND_KEYSTORE_PASSWORD }}
          IRONMIND_KEY_ALIAS: ${{ secrets.IRONMIND_KEY_ALIAS }}
          IRONMIND_KEY_PASSWORD: ${{ secrets.IRONMIND_KEY_PASSWORD }}
        # arm64 only: every phone from the last ~8 years; 3x less native compilation and a smaller APK.
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: IronMind-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
