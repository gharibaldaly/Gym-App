name: ironmind
description: "IronMind – personal gym AI coach (workouts, nutrition, sleep, body, Claude-powered coach)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^3.4.3

  # Local database
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Utils
  intl: ^0.20.2
  http: ^1.6.0
  uuid: ^4.6.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  package_info_plus: ^10.2.2

  # Workout
  speech_to_text: ^7.5.0
  wakelock_plus: ^1.8.1
  vibration: ^3.2.1
  confetti: ^0.8.0

  # Media
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  flutter_cache_manager: ^3.4.5
  cached_network_image: ^4.0.4
  flutter_svg: ^2.3.0

  # Charts & reports
  fl_chart: ^1.2.0
  pdf: ^3.13.1
  share_plus: ^13.3.1

  # System
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  home_widget: ^0.10.0
  workmanager: ^0.10.10
  health: ^13.3.2
  local_auth: ^3.0.2
  permission_handler: ^13.0.2

  # Backup
  archive: ^4.5.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
